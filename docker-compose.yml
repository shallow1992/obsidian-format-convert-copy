services:
  format-convert: &format-convert
    build: .
    container_name: obsidian-format-convert-copy-dev
    working_dir: /app
    volumes:
      - ./:/app
      - format_convert_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - devnet

  format-convert-copy:
    <<: *format-convert

volumes:
  format_convert_node_modules:

networks:
  devnet:
    external: true
